name: ci

on: [ push, pull_request ]

jobs:
  lint:
   runs-on: ubuntu-latest
   steps:
   - name: Checkout
     uses: actions/checkout@v4
   - name: Set up uv
     uses: astral-sh/setup-uv@v5
   - run: uv sync --group dev
   - run: uv run flake8 facefusion.py install.py
   - run: uv run flake8 facefusion tests
   - run: uv run mypy facefusion.py install.py
   - run: uv run mypy facefusion tests
  test:
   strategy:
    matrix:
     os: [ macos-latest, ubuntu-latest, windows-latest ]
   runs-on: ${{ matrix.os }}
   steps:
   - name: Checkout
     uses: actions/checkout@v4
   - name: Set up FFmpeg
     uses: AnimMouse/setup-ffmpeg@v1
   - name: Set up uv
     uses: astral-sh/setup-uv@v5
   - run: uv sync --group dev
   - run: uv run pytest
  report:
   needs: test
   runs-on: ubuntu-latest
   steps:
   - name: Checkout
     uses: actions/checkout@v4
   - name: Set up FFmpeg
     uses: AnimMouse/setup-ffmpeg@v1
   - name: Set up uv
     uses: astral-sh/setup-uv@v5
   - run: uv sync --group dev
   - run: uv run pytest tests --cov facefusion
   - run: uv run coveralls --service github
     env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
